<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8bd6"/>
      <stop offset="1" stop-color="#0a3a63"/>
    </linearGradient>
    <radialGradient id="fish" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd6a5"/>
      <stop offset="55%" stop-color="#ff922b"/>
      <stop offset="100%" stop-color="#c85a13"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#fbg)"/>

  <!-- bubbles -->
  <circle cx="30" cy="30" r="5" fill="#ffffff" opacity="0.35"/>
  <circle cx="44" cy="20" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="98" cy="34" r="4" fill="#ffffff" opacity="0.3"/>

  <!-- fish body -->
  <ellipse cx="60" cy="70" rx="34" ry="22" fill="url(#fish)"/>
  <!-- tail -->
  <path d="M92 70 l22 -16 l0 32 z" fill="#ff922b"/>
  <!-- fin -->
  <path d="M52 50 q10 -4 18 6 z" fill="#ffb066"/>
  <!-- eye -->
  <circle cx="44" cy="64" r="7" fill="#fff"/>
  <circle cx="42" cy="65" r="3.5" fill="#111"/>

  <!-- crosshair (targeting) -->
  <circle cx="60" cy="70" r="30" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.55"/>
  <path d="M60 34 v10 M60 96 v10 M24 70 h10 M96 70 h10" stroke="#ffffff" stroke-width="2.5" opacity="0.55"/>
</svg>
